<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title description">
  <title id="title">Begrijpelijke gegevens tussen overheidsdiensten</title>
  <desc id="description">Een agentschap en een departement verwijzen naar hetzelfde gedeelde begrip met een eenduidige definitie. Zo blijft de betekenis van de gegevens behouden.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#1f5fbf"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#243746">
    <rect x="15" y="30" width="240" height="190" rx="14" fill="#f5f7fa" stroke="#c7d1dd" stroke-width="2"/>
    <path d="M104 60h62v46h-22l-16 15v-15h-24Z" fill="#fff" stroke="#243746" stroke-width="3" stroke-linejoin="round"/>
    <text x="135" y="92" font-size="27" font-weight="700">=</text>
    <text x="135" y="162" font-size="24" font-weight="700">Agentschap</text>
    <text x="135" y="193" font-size="19">Bedoelt dit begrip</text>
    <path d="M270 125H310M630 125H590" stroke="#1f5fbf" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="325" y="30" width="250" height="190" rx="14" fill="#fff8d6" stroke="#e0b900" stroke-width="2"/>
    <g fill="none" stroke="#243746" stroke-width="3" stroke-linejoin="round">
      <path d="M450 69q-18-12-43-7v54q25-5 43 7 18-12 43-7V62q-25-5-43 7Z" fill="#fff"/>
      <path d="M450 69v54M418 78l21 3M418 91l21 3M461 81l21-3M461 94l21-3"/>
    </g>
    <text x="450" y="162" font-size="23" font-weight="700">Gedeeld begrip</text>
    <text x="450" y="193" font-size="19">Eenduidige definitie</text>
    <rect x="645" y="30" width="240" height="190" rx="14" fill="#f5f7fa" stroke="#c7d1dd" stroke-width="2"/>
    <path d="M734 60h62v46h-22l-16 15v-15h-24Z" fill="#fff" stroke="#243746" stroke-width="3" stroke-linejoin="round"/>
    <text x="765" y="92" font-size="27" font-weight="700">=</text>
    <text x="765" y="162" font-size="24" font-weight="700">Departement</text>
    <text x="765" y="193" font-size="19">Begrijpt hetzelfde begrip</text>
  </g>
