<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title description">
  <title id="title">Ook AI heeft gedeelde betekenis nodig</title>
  <desc id="description">Zonder expliciete afspraken moet een AI-agent de betekenis van een eigen datamodel interpreteren, met risico op verkeerde aannames. Gedeelde standaarden leggen definities, codes en relaties vast, zodat een AI-agent die afspraken kan volgen met minder ruimte voor aannames. Bewerkbare bron: ai-gebruik.drawio.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#c66a2b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#1f5fbf"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243746">
    <text x="20" y="35" font-size="25" font-weight="700" fill="#873e15">Zonder expliciete afspraken</text>
    <rect x="20" y="65" width="320" height="110" rx="12" fill="#f5f7fa" stroke="#c7d1dd" stroke-width="2"/>
    <g fill="#fff2e8" stroke="#c66a2b" stroke-width="2">
      <rect x="440" y="65" width="320" height="110" rx="12"/>
      <rect x="860" y="65" width="320" height="110" rx="12"/>
    </g>
    <g text-anchor="middle" font-size="22">
      <text x="180" y="105">Eigen datamodel</text>
      <text x="180" y="147">dossier · status = 1</text>
      <text x="600" y="105">AI-agent</text>
      <text x="600" y="147">Wat betekent status 1?</text>
      <g fill="#873e15">
        <text x="1020" y="105">Zelf interpreteren</text>
        <text x="1020" y="147">Risico op verkeerde aannames</text>
      </g>
    </g>
    <g fill="none" stroke="#c66a2b" stroke-width="3" marker-end="url(#arrow-orange)">
      <path d="M342 120H436"/>
      <path d="M762 120H856"/>
    </g>
    <path d="M20 205H1180" stroke="#c7d1dd" stroke-dasharray="6 6"/>
    <text x="20" y="255" font-size="25" font-weight="700" fill="#1f5fbf">Met gedeelde standaarden</text>
    <rect x="20" y="285" width="320" height="110" rx="12" fill="#fff8d6" stroke="#e0b900" stroke-width="2"/>
    <g fill="#eaf2ff" stroke="#1f5fbf" stroke-width="2">
      <rect x="440" y="285" width="320" height="110" rx="12"/>
      <rect x="860" y="285" width="320" height="110" rx="12"/>
    </g>
    <g text-anchor="middle" font-size="22">
      <text x="180" y="325">Gedeeld datamodel</text>
      <text x="180" y="367">definities · codes · relaties</text>
      <text x="600" y="325">AI-agent</text>
      <text x="600" y="367">De betekenis is vastgelegd.</text>
      <text x="1020" y="325">Standaarden volgen</text>
      <text x="1020" y="367">Minder ruimte voor aannames</text>
    </g>
    <g fill="none" stroke="#1f5fbf" stroke-width="3" marker-end="url(#arrow-blue)">
      <path d="M342 340H436"/>
      <path d="M762 340H856"/>
    </g>
  </g>
</svg>
