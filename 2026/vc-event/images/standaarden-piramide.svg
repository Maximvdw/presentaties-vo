<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">Piramide van datamodelleringsstandaarden</title>
  <desc id="description">Vijf lagen, van een brede internationale basis naar een toepassingsspecifieke top. Van onder naar boven: internationale standaarden zoals W3C en OGC; Vlaamse overheid met OSLO-standaarden; entiteit zoals een departement of agentschap; beleidsdomein met domeinspecifieke afspraken; toepassing met een eigen, domeinspecifiek model.</desc>
  <g stroke="#fff" stroke-width="4" stroke-linejoin="round">
    <path d="M280 20 332 96H228Z" fill="#ffdf57"/>
    <path d="M228 96H332L384 172H176Z" fill="#ffedaa"/>
    <path d="M176 172H384L436 248H124Z" fill="#dce8f7"/>
    <path d="M124 248H436L488 324H72Z" fill="#8cb4e8"/>
    <path d="M72 324H488L540 400H20Z" fill="#1f5fbf"/>
  </g>
  <g fill="none" stroke="#718494" stroke-width="2">
    <path d="M306 58H565"/>
    <path d="M358 134H565"/>
    <path d="M410 210H565"/>
    <path d="M462 286H565"/>
    <path d="M514 362H565"/>
  </g>
  <g fill="#243746" font-family="Arial, Helvetica, sans-serif">
    <g font-size="24" font-weight="700">
      <text x="585" y="52">Toepassing</text>
      <text x="585" y="128">Beleidsdomein</text>
      <text x="585" y="204">Entiteit</text>
      <text x="585" y="280">Vlaamse Overheid</text>
      <text x="585" y="356">Internationale standaarden</text>
    </g>
    <g font-size="19">
      <text x="585" y="80">Eigen, domeinspecifiek model</text>
      <text x="585" y="156">Domeinspecifieke afspraken</text>
      <text x="585" y="232">Departement of Agentschap</text>
      <text x="585" y="308">OSLO-standaarden</text>
      <text x="585" y="384">W3C, OGC, ...</text>
    </g>
  </g>
</svg>
